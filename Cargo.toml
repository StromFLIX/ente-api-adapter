[package]
name = "ente-api"
version = "0.1.0"
edition = "2021"
description = "Rust adapter for a self-hosted Ente museum instance"

[[bin]]
name = "ente-api"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dryoc = "0.7"
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
