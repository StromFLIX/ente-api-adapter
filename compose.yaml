services:
  ente-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Point this at your self-hosted museum instance.
      ENTE_API_URL: ${ENTE_API_URL:-http://host.docker.internal:8080}
      ENTE_DOWNLOAD_URL: ${ENTE_DOWNLOAD_URL:-}
      ENTE_TIMEOUT: ${ENTE_TIMEOUT:-60}
      SESSION_TTL: ${SESSION_TTL:-86400}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
