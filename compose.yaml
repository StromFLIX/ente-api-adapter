services:
  ente-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Point this at your self-hosted museum instance.
      ENTE_API_URL: ${ENTE_API_URL:-http://host.docker.internal:8080}
      ENTE_DOWNLOAD_URL: ${ENTE_DOWNLOAD_URL:-}
      ENTE_TIMEOUT: ${ENTE_TIMEOUT:-60}
      SESSION_TTL: ${SESSION_TTL:-86400}
      # Cap concurrent image download+decrypt work so a burst of requests can't
      # exhaust memory or starve the runtime.
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-4}
      # Thumbnails get their own, much larger budget -- they are tens of KB and
      # must not queue behind multi-MB full-image downloads.
      MAX_CONCURRENT_THUMBNAILS: ${MAX_CONCURRENT_THUMBNAILS:-32}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
